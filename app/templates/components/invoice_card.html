<a href="/invoices/{{ invoice.id }}" class="panel block hover:border-cyan-500/60">
  <div class="flex items-start justify-between">
    <div>
      <h3 class="font-semibold text-white">{{ invoice.invoice_number }}</h3>
      <p class="mt-1 text-sm text-slate-400">{{ invoice.total|money }} · Balance {{ invoice.balance_due|money }}</p>
      <p class="mt-2 text-sm text-slate-500">{{ invoice.customer.name if invoice.customer else "No customer" }} · Due {{ invoice.due_date|date }}</p>
    </div>
    {% with status=invoice.status.value %}{% include "components/status_badge.html" %}{% endwith %}
  </div>
</a>
