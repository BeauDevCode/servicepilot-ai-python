<a href="/quotes/{{ quote.id }}" class="panel block hover:border-cyan-500/60">
  <div class="flex items-start justify-between">
    <div>
      <h3 class="font-semibold text-white">{{ quote.quote_number }}</h3>
      <p class="mt-1 text-sm text-slate-400">{{ quote.total|money }} · {{ quote.created_at|date }}</p>
    </div>
    {% with status=quote.status.value %}{% include "components/status_badge.html" %}{% endwith %}
  </div>
</a>
