<a href="/jobs/{{ job.id }}" class="panel block hover:border-cyan-500/60">
  <div class="flex items-start justify-between gap-3">
    <div>
      <h3 class="font-semibold text-white">{{ job.title }}</h3>
      <p class="mt-1 text-sm text-slate-400">{{ job.service_type }} · {{ job.customer.name if job.customer else "Unassigned" }} · {{ job.scheduled_date|date }}</p>
      <p class="mt-2 line-clamp-2 text-sm text-slate-500">{{ job.description }}</p>
    </div>
    {% with status=job.status.value %}{% include "components/status_badge.html" %}{% endwith %}
  </div>
</a>
